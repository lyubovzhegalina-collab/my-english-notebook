<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>My English Notebook</title><style>*{box-sizing:border-box}html{background:#000;color-scheme:dark}body{margin:0;min-height:100vh;background:#000;color:#ecf2ea;font:16px/1.5 system-ui,-apple-system,sans-serif}header{background:#080808;border-bottom:1px solid #29372c;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 22px;}header h1,header p{max-width:900px;margin-left:auto;margin-right:auto}h1{margin-top:0;margin-bottom:4px;font-size:clamp(22px,5vw,30px);line-height:1.25;letter-spacing:-.6px;overflow-wrap:anywhere}header p{margin-top:4px;margin-bottom:0;color:#b5c5b6;font-size:14px}main{max-width:900px;margin:auto;padding:22px 16px calc(32px + env(safe-area-inset-bottom,0px))}nav{display:flex;gap:9px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:thin;scrollbar-color:#405346 transparent}nav button{white-space:nowrap;flex:0 0 auto;padding:10px 14px;font-size:14px}button{cursor:pointer;border:1px solid #536956;border-radius:12px;padding:11px 15px;background:transparent;color:#e4eee3;font:inherit;transition:border-color .15s,background .15s}button:hover{border-color:#9db89b;background:#1d2b20}button.active{background:transparent;color:#b7e4a9;border-color:#9bc48e}button.primary{background:#71966a;border-color:#71966a;color:#081208;font-weight:700}button.primary:hover{background:#89aa81}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #a4d298;outline-offset:2px}.card{background:#141414;border:1px solid #353535;border-radius:18px;padding:20px;margin:14px 0;box-shadow:none}input,textarea,select{font:inherit;width:100%;border:1px solid #455849;border-radius:10px;padding:12px;margin:6px 0 12px;background:#0c0c0c;color:#ecf2ea;min-height:44px}input::placeholder,textarea::placeholder{color:#8d9d90}small,.muted{color:#a3b2a4}.tag{font-size:12px;background:#26372a;border:1px solid #425746;border-radius:7px;padding:4px 8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}h2{font-size:23px;margin:24px 0 18px;letter-spacing:-.4px}h3{margin-top:4px}.hidden{display:none}label{font-size:13px;font-weight:600;color:#c6d4c7}details{margin-top:10px}summary{cursor:pointer;color:#c2dfb7}.word{font-size:22px;font-weight:700}.empty{padding:20px;color:#a3b2a4;text-align:center}a{color:#b7e4a9}@media(min-width:700px){header{padding-top:32px}main{padding:28px 24px}nav button{font-size:15px}}.theory-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.theory-icon{font-size:22px;background:#27352a;border:1px solid #435849;border-radius:12px;width:46px;height:46px;display:grid;place-items:center}.theory-head h3{margin:0;font-size:19px}.theory-kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9fc795;font-weight:750}.theory-sub{font-size:13px;color:#9caca0}.theory-block{border:1px solid #36433a;background:#151a17;border-radius:13px;padding:14px;margin:12px 0}.theory-block h4{font-size:13px;color:#c4e1bc;margin:0 0 9px}.theory-formula{font-weight:700;line-height:1.65;color:#f2f7ef;overflow-wrap:anywhere}.theory-note{font-size:14px;color:#c3cfc2;margin:8px 0 0}.theory-chip{display:inline-block;border:1px solid #5c785f;background:#26382a;color:#c9e9bd;border-radius:9px;padding:7px 10px;margin:3px 4px 3px 0;font-weight:650;font-size:14px}.theory-ex{border-left:3px solid #88ad7f;padding:10px 12px;margin:9px 0;background:#1c2820;border-radius:0 10px 10px 0}.theory-ex .en{font-weight:700;color:#f3f6f2}.theory-ex .pron{font-size:13px;color:#b1d0aa;margin-top:3px}.theory-ex .ru{font-size:13px;color:#aeb9ae;margin-top:3px}.theory-table{width:100%;border-collapse:collapse;font-size:14px}.theory-table td{border-bottom:1px solid #344137;padding:9px 5px}.theory-table td:first-child{color:#b4c5b5}.theory-table td:last-child{color:#d4edca;font-weight:700}.theory-summary{font-size:14px;font-weight:650;color:#bddfb3}.theory-section{margin-top:16px}.theory-section>h4{font-size:14px;color:#d5e9ce;margin-bottom:8px}.lesson-section-title{margin:25px 0 12px;font-size:18px;color:#bdddaf;letter-spacing:.01em}</style><style>.visual-word{height:132px;display:flex;align-items:center;justify-content:center;margin:0 0 15px;border-radius:16px;background:linear-gradient(135deg,#253427,#18241d);border:1px solid #405744;font-size:76px;line-height:1}.visual-word img{height:105px;width:105px;object-fit:contain}.visual-word .visual-fallback{display:none}.visual-word.visual-error img{display:none}.visual-word.visual-error .visual-fallback{display:block}.visual-word .visual-fallback{font-size:76px}</style><style>.practice-area{max-width:480px;margin:0 auto}.flip-card{display:block;position:relative;width:100%;height:345px;padding:0;border:0;background:transparent;perspective:1200px;text-align:center;cursor:pointer}.flip-card:hover{background:transparent;border:0}.flip-card:focus-visible{outline:3px solid #b7e4a9;outline-offset:5px}.flip-card-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1)}.flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}.flip-card-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:24px;background:#141b16;border:1px solid #526a53;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 12px 28px #0005}.flip-card-back{transform:rotateY(180deg);background:#203224}.flip-card .visual-word{width:100%;height:140px;margin:0}.flip-card .word{display:block;font-size:clamp(21px,5vw,29px);line-height:1.25;overflow-wrap:anywhere}.flip-pron{font-size:clamp(17px,4vw,22px);color:#c4e7bb;font-weight:650}.flip-label{color:#a8c4a6;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.flip-hint{font-size:13px;color:#a2bca1;margin-top:12px}.practice-next{display:block;width:100%;margin-top:18px}@media(prefers-reduced-motion:reduce){.flip-card-inner{transition:none}}</style><header><h1>My English Notebook 🌿</h1><p>Моя тетрадь английского · A1</p></header><main><nav id="tabs"></nav><section id="view"></section></main><script>
const seed={lessons:[{id:1,title:"Daily routine",date:"",note:"Пример урока — можно переименовать"}],words:[{id:1,lessonId:1,en:"wake up",ipa:"/weɪk ʌp/",ruPron:"уЭЙК ап",ru:"просыпаться",example:"I wake up at eight.",examplePron:"ай уЭЙК ап эт ЭЙТ",exampleRu:"Я просыпаюсь в восемь."},{id:2,lessonId:1,en:"have breakfast",ipa:"/hæv ˈbrekfəst/",ruPron:"хэв брЭкфэст",ru:"завтракать",example:"I have breakfast at home.",examplePron:"ай хэв брЭкфэст эт хОУМ",exampleRu:"Я завтракаю дома."}],grammar:[],favorites:[],learned:[]};let state;try{state=JSON.parse(localStorage.getItem("men-data"))||seed}catch{state=seed}let tab="lessons",selected=1,flip=false;const save=()=>localStorage.setItem("men-data",JSON.stringify(state));const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const v=document.getElementById("view");function nav(){document.getElementById("tabs").innerHTML=[["lessons","📚 Уроки"],["dictionary","🔤 Словарь"],["grammar","📖 Грамматика"],["practice","🧠 Практика"],["settings","⚙️ Данные"]].map(([k,n])=>'<button class="'+(tab===k?'active':'')+'" onclick="go(\''+k+'\')">'+n+'</button>').join("")}function go(k){tab=k;render()}function render(){nav();if(tab==="lessons"){v.innerHTML='<h2>Мои уроки</h2>'+state.lessons.map(l=>'<div class="card"><b>Урок '+l.id+': '+esc(l.title)+'</b><p class="muted">'+esc(l.date||"Дата не указана")+' · '+state.words.filter(w=>w.lessonId===l.id||(w.lessonIds||[]).includes(l.id)).length+' слов</p><button onclick="selected='+l.id+';showLesson()">Открыть</button></div>').join("")+'<div class="card"><h3>Добавить урок</h3><form onsubmit="addLesson(event)"><label>Название урока</label><input name="title" required placeholder="Например, My family"><label>Дата (необязательно)</label><input name="date" type="date"><button class="primary">Добавить урок</button></form></div>'}else if(tab==="dictionary"){v.innerHTML='<h2>Словарь A–Z</h2><input placeholder="Поиск по английскому или русскому..." oninput="dictionary(this.value)" id="search"><div id="words"></div>';dictionary("")}else if(tab==="grammar"){v.innerHTML='<h2>Грамматика</h2>'+state.grammar.map(theoryCard).join("")+'<div class="card"><h3>Добавить правило</h3><form onsubmit="addGrammar(event)"><input name="title" placeholder="Название" required><textarea name="rule" placeholder="Правило и формула" required></textarea><textarea name="example" placeholder="Пример, произношение и перевод"></textarea><button class="primary">Сохранить</button></form></div>'}else if(tab==="practice"){let w=state.words[Math.floor(Math.random()*state.words.length)];v.innerHTML='<h2>Карточки</h2>'+(w?'<div class="practice-area"><p class="muted" style="text-align:center">Нажми на карточку, чтобы перевернуть</p><button type="button" class="flip-card" id="practiceFlip" aria-label="Перевернуть карточку" aria-pressed="false" onclick="flipPracticeCard(this)"><span class="flip-card-inner"><span class="flip-card-face flip-card-front"><span class="visual-word">'+visualFor(w.en)+'</span><span class="word">'+esc(w.en)+'</span><span class="muted">'+esc(w.ipa)+'</span><span class="flip-hint">↻ Нажми, чтобы увидеть перевод</span></span><span class="flip-card-face flip-card-back"><span class="flip-label">Перевод</span><span class="word">'+esc(w.ru)+'</span><span class="flip-pron">'+esc(w.ruPron)+'</span><span class="flip-hint">↻ Нажми, чтобы вернуться</span></span></span></button><button class="primary practice-next" onclick="render()">Следующее слово →</button></div>':'<p>Добавь слова, чтобы начать тренировку.</p>')}else{v.innerHTML='<h2>Мои данные</h2><p>Данные сейчас сохраняются только в браузере этого устройства. Для переноса на другое устройство используй резервную копию.</p><div class="card"><button onclick="exportData()">Скачать резервную копию JSON</button><p><label>Восстановить из JSON</label><input type="file" accept=".json,application/json" onchange="importData(event)"></p></div><p class="muted">Синхронизация и распознавание скриншотов будут добавлены позже.</p>'}}function flipPracticeCard(el){el.classList.toggle("flipped");el.setAttribute("aria-pressed",el.classList.contains("flipped")?"true":"false")}function theoryExample(en,pron,ru){return '<div class="theory-ex"><div class="en">'+esc(en)+'</div><div class="pron">🔊 '+esc(pron)+'</div><div class="ru">'+esc(ru)+'</div></div>'}function extraTheory(g){if(g.kind==="numbers100")return '<div class="theory-block"><h4>01 · Числа 1–12</h4><div class="theory-formula">one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve</div>'+theoryExample("I have two cats.","ай хЭВ тУ кЭТС","У меня две кошки.")+'</div><div class="theory-block"><h4>02 · Числа 13–19: -teen</h4><div class="theory-formula">thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen</div><p class="theory-note">Обрати внимание: thirteen ≠ thirty; fifteen ≠ fifty. В изолированном произношении у -teen часто ударение на последнем слоге.</p>'+theoryExample("She is sixteen.","ши из сиксТИН","Ей шестнадцать.")+'</div><div class="theory-block"><h4>03 · Десятки: -ty</h4><div class="theory-formula">twenty · thirty · forty · fifty · sixty · seventy · eighty · ninety · one hundred</div>'+theoryExample("My mum is forty.","май мАМ из ФОРти","Моей маме сорок.")+'</div><div class="theory-block"><h4>04 · Составные числа</h4><div class="theory-formula">twenty-one = 21 · thirty-five = 35 · forty-eight = 48 · ninety-nine = 99</div>'+theoryExample("I have twenty-five books.","ай хЭВ ТУЭНти фАЙВ бУКС","У меня двадцать пять книг.")+'<p class="theory-note">В письменном английском числа 21–99 (кроме круглых десятков) пишутся через дефис.</p></div>';if(g.kind==="daily9")return '<div class="theory-block"><h4>01 · Наречия частоты</h4><div class="theory-formula">always → usually → often → sometimes → rarely → never</div>'+theoryExample("I usually work from home.","ай Южуэли уЁРК фром хОУМ","Обычно я работаю из дома.")+theoryExample("She is always busy.","ши из ОЛуэйз БИзи","Она всегда занята.")+'<p class="theory-note">Ставим перед обычным глаголом, но после am/is/are.</p></div><div class="theory-block"><h4>02 · Частота и дни недели</h4><div class="theory-formula">every day · once a week · twice a week · three times a week · on Mondays · at the weekend</div>'+theoryExample("I do a workout twice a week.","ай дУ э УЁРКаут туАЙС э уИК","Я тренируюсь дважды в неделю.")+'</div><div class="theory-block"><h4>03 · Части дня</h4><div class="theory-formula">in the morning · in the afternoon · in the evening · at night</div>'+theoryExample("I read books in the evening.","ай рИД бУКС ин зи ИВнинг","Я читаю книги вечером.")+'</div><div class="theory-block"><h4>04 · Как сказать время</h4><div class="theory-formula">past — после часа; to — до следующего часа; quarter — 15 минут; half — 30 минут</div>'+theoryExample("It’s quarter past six. (6:15)","итс КУОтэ пАСТ сИКС","Шесть пятнадцать.")+theoryExample("It’s half past eleven. (11:30)","итс хАФ пАСТ иЛЭВэн","Одиннадцать тридцать.")+theoryExample("It’s quarter to seven. (6:45)","итс КУОтэ ту СЭВэн","Без пятнадцати семь.")+'</div><div class="theory-block"><h4>05 · Daily Routine и Present Simple</h4><div class="theory-formula">I / you / we / they + verb · he / she / it + verb-s</div>'+theoryExample("I wake up at eight. She wakes up at seven.","ай уЭЙК ап эт ЭЙТ. ши уЭЙКС ап эт СЭВэн","Я просыпаюсь в восемь. Она просыпается в семь.")+'<p class="theory-note">Do you work from home? — Yes, I do. / No, I don’t. Does she work from home? — Yes, she does. / No, she doesn’t.</p></div>';if(g.kind==="can8")return '<div class="theory-block"><h4>01 · Утверждение и отрицание</h4><div class="theory-formula">I / you / he / she / we / they + can / can’t + глагол без to</div>'+theoryExample("I can build a website.","ай кэн бИЛД э УЭБсайт","Я умею создавать сайты.")+theoryExample("She can’t drive a car.","ши кАНТ дрАЙВ э кАР","Она не умеет водить машину.")+'</div><div class="theory-block"><h4>02 · Общие вопросы</h4><div class="theory-formula">Can + подлежащее + глагол без to + ... ?</div>'+theoryExample("Can you make a cake? — Yes, I can.","кэн ю мЭЙК э кЭЙК — йЕС ай кэн","Ты умеешь печь торт? — Да.")+theoryExample("Can you swim? — No, I can’t.","кэн ю суИМ — нОУ ай кАНТ","Ты умеешь плавать? — Нет.")+'</div><div class="theory-block"><h4>03 · Специальные вопросы</h4><div class="theory-formula">What / Where / When / How / How often / Who + can + подлежащее + глагол?</div>'+theoryExample("How well can you sing?","хАУ уЭЛ кэн ю сИНГ","Насколько хорошо ты поёшь?")+theoryExample("Who can help me?","хУ кэн хЭЛП ми","Кто может мне помочь?")+'<p class="theory-note">Когда who само является подлежащим, дополнительное подлежащее не нужно: Who can help me? После can никогда не ставим to, -s или -ing. Для оценки навыка используем well, a little bit, not very well, badly; в отрицании — at all.</p></div>';if(g.kind==="havegotquestions")return '<div class="theory-block"><h4>01 · Общие вопросы</h4><div class="theory-formula">Have / Has + I / you / he / she / we / they + got + ... ?</div>'+theoryExample("Have you got a lot of friends?","хэв ю гОТ э лОТ ов фрЭНДЗ","У тебя много друзей?")+theoryExample("Has he got blond hair?","хэз хи гОТ блОНД хЭА","У него светлые волосы?")+'</div><div class="theory-block"><h4>02 · Короткие ответы</h4><div class="theory-formula">Yes, I have. / No, I haven’t. · Yes, she has. / No, she hasn’t.</div>'+theoryExample("Has she got a boyfriend? — No, she hasn’t.","хэз ши гОТ э БОЙфрэнд — нОУ, ши ХЭЗЭНТ","У неё есть парень? — Нет.")+'</div><div class="theory-block"><h4>03 · Специальные вопросы</h4><div class="theory-formula">Question word + have / has + subject + got + ... ?</div>'+theoryExample("How many friends have you got?","хАУ МЭни фрЭНДЗ хэв ю гОТ","Сколько у тебя друзей?")+theoryExample("What hobbies have you got?","уОТ ХОбиз хэв ю гОТ","Какие у тебя увлечения?")+'<p class="theory-note">Важно: в вопросе Have you got...? слово have ставим перед подлежащим. После he/she/it используем has. В коротком ответе got не повторяем.</p></div>';if(g.kind==="someany7")return '<div class="theory-block"><h4>01 · Утверждение: SOME</h4><div class="theory-formula">There is / are + some + существительное</div>'+theoryExample("There are some apples on the table.","зэр а сАМ Эплз он зэ ТЭЙбл","На столе есть несколько яблок.")+theoryExample("I have got some interesting news.","ай хэв гОТ сАМ ИНтрэстинг нЬЮЗ","У меня есть интересные новости.")+'</div><div class="theory-block"><h4>02 · Отрицание: ANY</h4><div class="theory-formula">There isn’t / aren’t + any + существительное</div>'+theoryExample("There isn’t any milk in the fridge.","зэр ИЗЭНТ Эни мИЛК ин зэ фрИДЖ","В холодильнике нет молока.")+theoryExample("He hasn’t got any money.","хи ХЭЗЭНТ гОТ Эни МАни","У него нет денег.")+'</div><div class="theory-block"><h4>03 · Вопрос: ANY</h4><div class="theory-formula">Is there / Are there + any + существительное?</div>'+theoryExample("Are there any chairs in the room?","а зэр Эни чЭАЗ ин зэ рУМ","В комнате есть стулья?")+theoryExample("Have you got any brothers or sisters?","хэв ю гОТ Эни БРАзэрз о СИстэрз","У тебя есть братья или сёстры?")+'</div><div class="theory-block"><h4>04 · Исключение: SOME в предложениях и просьбах</h4>'+theoryExample("Would you like some tea?","вуд ю лАЙК сАМ тИ","Хочешь чаю?")+theoryExample("Can I have some water?","кэн ай хэв сАМ уОТэ","Можно мне немного воды?")+'<p class="theory-note">Some и any используются как с исчисляемыми существительными во множественном числе (apples), так и с неисчисляемыми (milk, money, homework, news). Не говорим «a news» или «homeworks».</p></div>';if(g.kind==="appearance6")return '<div class="theory-block"><h4>01 · Рост и телосложение</h4><div class="theory-formula">I am / She is / They are + прилагательное</div>'+theoryExample("She is tall and slim.","ши из тОЛ энд слИМ","Она высокая и стройная.")+theoryExample("He is short.","хи из шОРТ","Он невысокий.")+'</div><div class="theory-block"><h4>02 · Волосы, глаза и особенности</h4><table class="theory-table"><tr><td>I / you / we / they</td><td>have got</td></tr><tr><td>he / she / it</td><td>has got</td></tr></table>'+theoryExample("She has got long curly hair.","ши хэз гОТ лОНГ КЁрли хЭА","У неё длинные кудрявые волосы.")+theoryExample("He hasn’t got a beard.","хи ХЭЗЭНТ гОТ э БИэд","У него нет бороды.")+'</div><div class="theory-block"><h4>03 · Как сказать возраст</h4>'+theoryExample("She is in her twenties.","ши из ин хё ТУЭНтиз","Ей от 20 до 29 лет.")+theoryExample("He is around 35.","хи из эрАУНД СЁти фАЙВ","Ему около 35 лет.")+'<p class="theory-note">in his thirties — от 30 до 39 лет, а не ровно 30. Around 35 — примерно 35 лет.</p></div><div class="theory-block"><h4>04 · Важные исключения</h4><table class="theory-table"><tr><td>one foot</td><td>two feet</td></tr><tr><td>one tooth</td><td>two teeth</td></tr></table><p class="theory-note">Hair обычно неисчисляемое: She has got long hair (не hairs). Для роста говорим tall / short, не small.</p></div>';if(g.kind==="havegot")return '<div class="theory-block"><h4>01 · Кто имеет?</h4><table class="theory-table"><tr><td>I / you / we / they</td><td>have got</td></tr><tr><td>he / she / it</td><td>has got</td></tr></table>'+theoryExample("I have got a big family.","ай хэв гОТ э бИГ ФЭмили","У меня большая семья.")+theoryExample("My cat has got blue eyes.","май кЭТ хэз гОТ блУ АЙЗ","У моей кошки голубые глаза.")+'</div><div class="theory-block"><h4>02 · Вопрос</h4><div class="theory-formula">Have / Has + кто + got + что?</div>'+theoryExample("Have you got a brother?","хэв ю гОТ э БРАзэ","У тебя есть брат?")+'<p class="theory-note">Yes, I have. / No, I haven’t.</p></div><div class="theory-block"><h4>03 · Отрицание</h4><div class="theory-formula">have not got = haven’t got; has not got = hasn’t got</div>'+theoryExample("She hasn’t got a car.","ши ХЭЗЭНТ гОТ э кАР","У неё нет машины.")+'</div><div class="theory-block"><h4>💡 Запомни</h4><p class="theory-note">Перед одним исчисляемым предметом обычно нужен a/an: a camera. Перед множественным числом артикль a/an не ставим: two brothers.</p></div>';if(g.kind==="anythere")return '<div class="theory-block"><h4>01 · Вопрос об одном предмете</h4><div class="theory-formula">Is there + a/an + предмет?</div>'+theoryExample("Is there a sofa in the room?","из зэр э сОУфа ин зэ рУМ","В комнате есть диван?")+'<p class="theory-note">Yes, there is. / No, there isn’t.</p></div><div class="theory-block"><h4>02 · Вопрос о нескольких</h4><div class="theory-formula">Are there + any + предметы?</div>'+theoryExample("Are there any flowers in the vase?","а зэр Эни флАУэрз ин зэ вАЗ","В вазе есть цветы?")+'<p class="theory-note">Yes, there are. / No, there aren’t.</p></div><div class="theory-block"><h4>💡 Разница</h4><p class="theory-note">There is / are — что находится в каком-то месте. Have got / has got — что есть у человека или животного.</p></div>';if(g.kind==="place")return '<div class="theory-block"><h4>01 · Где находится предмет?</h4><table class="theory-table"><tr><td>on</td><td>на поверхности</td></tr><tr><td>in</td><td>внутри</td></tr><tr><td>under</td><td>под</td></tr><tr><td>above</td><td>выше / над</td></tr><tr><td>behind</td><td>позади</td></tr><tr><td>in front of</td><td>перед</td></tr><tr><td>between</td><td>между двумя</td></tr><tr><td>next to</td><td>рядом с</td></tr><tr><td>near</td><td>около</td></tr><tr><td>opposite</td><td>напротив</td></tr></table></div><div class="theory-block"><h4>02 · Формула</h4><div class="theory-formula">Предмет + is/are + предлог + место</div>'+theoryExample("The lamp is next to the bed.","зэ лЭМП из нЭКСТ ту зэ бЭД","Лампа рядом с кроватью.")+theoryExample("The books are on the shelf.","зэ бУКС а он зэ шЭЛФ","Книги на полке.")+'</div><div class="theory-block"><h4>03 · Сравни</h4>'+theoryExample("The cat is under the table.","зэ кЭТ из АНдэ зэ тЭЙбл","Кошка под столом.")+theoryExample("The cat is behind the table.","зэ кЭТ из биХАЙНД зэ тЭЙбл","Кошка за столом.")+'<p class="theory-note">Near — недалеко, next to — прямо рядом. Above — выше, on — на поверхности. После opposite слово to обычно не нужно: opposite the sofa.</p></div>';if(g.kind==="thereis")return '<div class="theory-block"><h4>01 · Один предмет или несколько?</h4><table class="theory-table"><tr><td>Один предмет</td><td>There is + a/an + предмет</td></tr><tr><td>Несколько</td><td>There are + предметы</td></tr></table>'+theoryExample("There is a bed in my room.","зэр из э бЭД ин май рУМ","В моей комнате есть кровать.")+theoryExample("There are three chairs.","зэр а срИ чЭАЗ","Здесь три стула.")+'</div><div class="theory-block"><h4>02 · Отрицание</h4><div class="theory-formula">There isn’t + один предмет / There aren’t + несколько</div>'+theoryExample("There isn’t a TV in my bedroom.","зэр Изэнт э ти-вИ ин май БЭДрум","В моей спальне нет телевизора.")+theoryExample("There aren’t any books on the shelf.","зэр АРЭНТ Эни бУКС он зэ шЭЛФ","На полке нет книг.")+'</div><div class="theory-block"><h4>03 · Вопрос</h4><div class="theory-formula">Is there + один предмет? / Are there + несколько?</div>'+theoryExample("Is there a sofa in the room?","из зэр э сОУфа ин зэ рУМ","В комнате есть диван?")+theoryExample("Are there any plants?","а зэр Эни плАНТС","Есть ли растения?")+'</div><div class="theory-block"><h4>💡 Запомни</h4><p class="theory-note">There is / there are — когда говорим, что что-то <b>есть или находится</b> в каком-то месте. С неисчисляемыми существительными тоже используем <b>there is</b>.</p></div>';const ex=(en,pron,ru)=>theoryExample(en,pron,ru);if(g.kind==="possessive")return '<div class="theory-block"><h4>01 · Таблица принадлежности</h4><table class="theory-table">'+[["I","my — мой"],["you","your — твой / ваш"],["he","his — его"],["she","her — её"],["it","its — его / её"],["we","our — наш"],["they","their — их"]].map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join("")+'</table></div><div class="theory-block"><h4>02 · Формула</h4><div class="theory-formula">my / your / his / her / its / our / their + предмет</div>'+ex("This is my family.","зис из май фЭмэли","Это моя семья.")+ex("Her name is Linda.","хёр нЭЙМ из лИнда","Её зовут Линда.")+'</div><div class="theory-block"><h4>💡 Не путай</h4><p class="theory-note"><b>He</b> — он, <b>his</b> — его. <b>She</b> — она, <b>her</b> — её. <b>It’s</b> = it is, а <b>its</b> = его/её.</p></div>';if(g.kind==="apostrophe")return '<div class="theory-block"><h4>01 · Один владелец</h4><div class="theory-formula">имя / человек + ’s + предмет</div>'+ex("This is Rosy’s car.","зис из рОузиз кАР","Это машина Рози.")+ex("Kate is my mother’s sister.","кЭЙТ из май мАзэрз сИстэр","Кейт — сестра моей мамы.")+'</div><div class="theory-block"><h4>02 · Несколько владельцев</h4><span class="theory-chip">girls → girls’ bikes</span><span class="theory-chip">children → children’s toys</span><p class="theory-note">Если множественное число уже оканчивается на <b>-s</b>, ставим только апостроф. Если нет — добавляем <b>’s</b>.</p></div><div class="theory-block"><h4>03 · Общая вещь у двоих</h4>'+ex("Anna and Pete’s car is new.","Эна энд пИтс кАР из нЬЮ","Машина Анны и Пита новая.")+'<p class="theory-note">Если вещь общая, ’s ставим после последнего имени.</p></div>';if(g.kind==="demonstratives")return '<div class="theory-block"><h4>01 · Один или несколько? Близко или далеко?</h4><table class="theory-table"><tr><td>Один · близко</td><td>THIS + is</td></tr><tr><td>Один · далеко</td><td>THAT + is</td></tr><tr><td>Несколько · близко</td><td>THESE + are</td></tr><tr><td>Несколько · далеко</td><td>THOSE + are</td></tr></table></div><div class="theory-block"><h4>02 · Примеры</h4>'+ex("This is my book.","зис из май бУК","Это моя книга (рядом).")+ex("That is her house.","зэт из хёр хАУС","Вон тот дом — её.")+ex("These are beautiful flowers.","зИЗ а бЬЮтифул флАУэрз","Это красивые цветы.")+ex("Those are my shoes.","зОУЗ а май шУЗ","Вон те туфли — мои.")+'</div><div class="theory-block"><h4>💡 Запомни</h4><p class="theory-note">This/that → <b>is</b>. These/those → <b>are</b>. В вопросе: <b>Are these flowers beautiful?</b></p></div>';return null}function theoryCard(g,i){const be=/^To be:/i.test(g.title),sp=/^Special questions:/i.test(g.title);let body=extraTheory(g);if(body!==null){}else if(be){body='<div class="theory-block"><h4>01 · Выбираем форму глагола</h4><table class="theory-table"><tr><td>I — я</td><td>am</td></tr><tr><td>He / She / It — он / она / оно</td><td>is</td></tr><tr><td>You / We / They — ты / вы / мы / они</td><td>are</td></tr></table></div><div class="theory-block"><h4>02 · Три типа предложений</h4><div class="theory-note">✓ Утверждение</div><div class="theory-formula">Кто + am/is/are + остальное</div>'+theoryExample("She is a doctor.","ши из э дОктэр","Она врач.")+'<div class="theory-note">✕ Отрицание</div><div class="theory-formula">Кто + am/is/are + not + остальное</div>'+theoryExample("She is not angry.","ши из нОт Энгри","Она не сердится.")+'<div class="theory-note">? Вопрос</div><div class="theory-formula">Am/Is/Are + кто + остальное?</div>'+theoryExample("Is she a doctor?","из ши э дОктэр","Она врач?")+'</div><div class="theory-block"><h4>03 · Сокращения</h4><span class="theory-chip">I am → I’m</span><span class="theory-chip">He is → He’s</span><span class="theory-chip">She is → She’s</span><span class="theory-chip">is not → isn’t</span><span class="theory-chip">are not → aren’t</span></div><div class="theory-block"><h4>💡 Запомни</h4><p class="theory-note">С профессиями в единственном числе обычно используем a / an: <b>a doctor</b>, <b>an office worker</b>.</p></div>'}else if(sp){body='<div class="theory-block"><h4>01 · Формула вопроса</h4><div class="theory-formula">Вопросительное слово + am/is/are + кто + остальное?</div>'+theoryExample("Where are you from?","уЭР а ю фром","Откуда ты?")+'</div><div class="theory-block"><h4>02 · Вопросительные слова</h4>'+[["What","что / какой"],["When","когда"],["Where","где / куда"],["Why","почему"],["Who","кто"],["Whose","чей"],["How","как"],["How old","сколько лет"],["How many","сколько (исчисляемых)"],["How much","сколько / цена"]].map(x=>'<span class="theory-chip">'+esc(x[0])+' · '+esc(x[1])+'</span>').join("")+'</div><div class="theory-block"><h4>03 · Примеры</h4>'+theoryExample("What is your job?","уОт из йор джОб","Кем ты работаешь?")+theoryExample("Why are you late?","уАЙ а ю лЭЙТ","Почему ты опоздал?")+theoryExample("How old is she?","хАУ ОУЛД из ши","Сколько ей лет?")+'</div><div class="theory-block"><h4>💡 Запомни</h4><p class="theory-note">На специальный вопрос отвечаем информацией, а не просто Yes или No.</p></div>'}else{body='<div class="theory-block"><h4>📌 Правило</h4><p class="theory-note">'+esc(g.rule)+'</p></div>'+(g.example?'<div class="theory-block"><h4>✏️ Примеры</h4><p class="theory-note">'+esc(g.example)+'</p></div>':'')}return '<article class="card theory-card"><div class="theory-head"><span class="theory-icon">'+(be?'🔤':sp?'❔':'📖')+'</span><div><div class="theory-kicker">Грамматика · A1</div><h3>'+esc(g.title)+'</h3></div></div><div class="theory-sub">Пошаговая шпаргалка с примерами</div>'+body+'</article>'}function showLesson(){let l=state.lessons.find(x=>x.id===selected);tab="lessons";nav();v.innerHTML='<button onclick="render()">← Все уроки</button><h2>Урок '+l.id+': '+esc(l.title)+'</h2>'+(state.grammar.some(g=>g.lessonId===selected)?'<h3 class="lesson-section-title">📖 Теория урока</h3>'+state.grammar.filter(g=>g.lessonId===selected).map(theoryCard).join(""):'')+'<h3 class="lesson-section-title">🔤 Слова A–Z</h3>'+state.words.filter(w=>w.lessonId===selected||(w.lessonIds||[]).includes(selected)).sort((a,b)=>a.en.localeCompare(b.en,'en',{sensitivity:'base'})).map(wordCard).join("")+'<div class="card"><h3>Добавить слово или фразу</h3><form onsubmit="addWord(event)">'+[['en','Английское слово / фраза'],['ipa','IPA'],['ruPron','Русская транскрипция с ударением'],['ru','Перевод'],['example','Пример на английском'],['examplePron','Произношение примера'],['exampleRu','Перевод примера']].map(([n,p])=>'<label>'+p+'</label><input name="'+n+'" '+(n==="en"||n==="ru"?"required":"")+' placeholder="'+p+'">').join("")+'<button class="primary">Добавить слово</button></form></div>'}function wordCard(w){return '<div class="card"><div class="visual-word">'+visualFor(w.en)+'</div><div class="row"><span class="word">'+esc(w.en)+'</span><button data-fav-id="'+w.id+'" onclick="toggleFav('+w.id+')">'+(state.favorites.includes(w.id)?"★":"☆")+'</button><button data-learn-id="'+w.id+'" onclick="toggleLearn('+w.id+')">'+(state.learned.includes(w.id)?"✓ Выучено":"Отметить")+'</button></div><p>'+esc(w.ipa)+' · '+esc(w.ruPron)+'</p><b>'+esc(w.ru)+'</b><details><summary>Пример</summary><p>'+esc(w.example)+'</p><p>'+esc(w.examplePron)+'</p><p class="muted">'+esc(w.exampleRu)+'</p></details></div>'}function dictionary(q){let ws=state.words.filter(w=>(w.en+" "+w.ru).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.en.localeCompare(b.en));document.getElementById("words").innerHTML=ws.map(wordCard).join("")||'<div class="empty">Пока ничего не найдено</div>'}function addLesson(e){e.preventDefault();let f=new FormData(e.target),id=Math.max(0,...state.lessons.map(x=>x.id))+1;state.lessons.push({id,title:f.get("title"),date:f.get("date")});save();render()}function addWord(e){e.preventDefault();let f=new FormData(e.target),w={id:Date.now(),lessonId:selected};for(let k of ["en","ipa","ruPron","ru","example","examplePron","exampleRu"])w[k]=f.get(k);let existing=state.words.find(x=>String(x.en).trim().toLowerCase()===String(w.en).trim().toLowerCase());if(existing){existing.lessonIds=Array.from(new Set([...(existing.lessonIds||[existing.lessonId]),selected]));alert("Слово уже есть в словаре. Оно добавлено к этому уроку без дублирования.")}else state.words.push(w);save();showLesson()}function addGrammar(e){e.preventDefault();let f=new FormData(e.target);state.grammar.push({title:f.get("title"),rule:f.get("rule"),example:f.get("example")});save();render()}function updateWordButtons(id){document.querySelectorAll("button[data-fav-id],button[data-learn-id]").forEach(b=>{if(Number(b.dataset.favId)===id){b.textContent=state.favorites.includes(id)?"★":"☆";b.setAttribute("aria-label",state.favorites.includes(id)?"Убрать из избранного":"Добавить в избранное")}if(Number(b.dataset.learnId)===id){b.textContent=state.learned.includes(id)?"✓ Выучено":"Отметить"}})}function toggleFav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();updateWordButtons(id)}function toggleLearn(id){state.learned=state.learned.includes(id)?state.learned.filter(x=>x!==id):[...state.learned,id];save();updateWordButtons(id)}function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="my-english-notebook.json";a.click();URL.revokeObjectURL(a.href)}async function importData(e){try{let s=JSON.parse(await e.target.files[0].text());if(!Array.isArray(s.words)||!Array.isArray(s.lessons))throw Error("Неверный формат");state=s;save();render();alert("Данные восстановлены")}catch{alert("Не удалось прочитать резервную копию")}}
