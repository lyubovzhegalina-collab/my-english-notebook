<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>My English Notebook</title><style>*{box-sizing:border-box}html{background:#000;color-scheme:dark}body{margin:0;min-height:100vh;background:#000;color:#ecf2ea;font:16px/1.5 system-ui,-apple-system,sans-serif}header{background:#080808;border-bottom:1px solid #29372c;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 22px;}header h1,header p{max-width:900px;margin-left:auto;margin-right:auto}h1{margin-top:0;margin-bottom:4px;font-size:clamp(22px,5vw,30px);line-height:1.25;letter-spacing:-.6px;overflow-wrap:anywhere}header p{margin-top:4px;margin-bottom:0;color:#b5c5b6;font-size:14px}main{max-width:900px;margin:auto;padding:22px 16px calc(32px + env(safe-area-inset-bottom,0px))}nav{display:flex;gap:9px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:thin;scrollbar-color:#405346 transparent}nav button{white-space:nowrap;flex:0 0 auto;padding:10px 14px;font-size:14px}button{cursor:pointer;border:1px solid #536956;border-radius:12px;padding:11px 15px;background:transparent;color:#e4eee3;font:inherit;transition:border-color .15s,background .15s}button:hover{border-color:#9db89b;background:#1d2b20}button.active{background:transparent;color:#b7e4a9;border-color:#9bc48e}button.primary{background:#71966a;border-color:#71966a;color:#081208;font-weight:700}button.primary:hover{background:#89aa81}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #a4d298;outline-offset:2px}.card{background:#141414;border:1px solid #353535;border-radius:18px;padding:20px;margin:14px 0;box-shadow:none}input,textarea,select{font:inherit;width:100%;border:1px solid #455849;border-radius:10px;padding:12px;margin:6px 0 12px;background:#0c0c0c;color:#ecf2ea;min-height:44px}input::placeholder,textarea::placeholder{color:#8d9d90}small,.muted{color:#a3b2a4}.tag{font-size:12px;backgr const seed={lessons:[{id:1,title:"Daily routine",date:"",note:"Пример урока — можно переименовать"}],words:[{id:1,lessonId:1,en:"wake up",ipa:"/weɪk ʌp/",ruPron:"уЭЙК ап",ru:"просыпаться",example:"I wake up at eight.",examplePron:"ай уЭЙК ап эт ЭЙТ",exampleRu:"Я просыпаюсь в восемь."},{id:2,lessonId:1,en:"have breakfast",ipa:"/hæv ˈbrekfəst/",ruPron:"хэв брЭкфэст",ru:"завтракать",example:"I have breakfast at home.",examplePron:"ай хэв брЭкфэст эт хОУМ",exampleRu:"Я завтракаю дома."}],grammar:[],favorites:[],learned:[]};let state;try{state=JSON.parse(localStorage.getItem("men-data"))||seed}catch{state=seed}let tab="lessons",selected=1,flip=false;const save=()=>localStorage.setItem("men-data",JSON.stringify(state));const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const v=document.getElementById("view");function nav(){document.getElementById("tabs").innerHTML=[["lessons","📚 Уроки"],["dictionary","🔤 Словарь"],["grammar","📖 Грамматика"],["practice","🧠 Практика"],["settings","⚙️ Данные"]].map(([k,n])=>'<button class="'+(tab===k?'active':'')+'" onclick="go(\''+k+'\')">'+n+'</button>').join("")}function go(k){tab=k;render()}function render(){nav();if(tab==="lessons"){v.innerHTML='<h2>Мои уроки</h2>'+state.lessons.map(l=>'<div class="card"><b>Урок '+l.id+': '+esc(l.title)+'</b><p class="muted">'+esc(l.date||"Дата не указана")+' · '+state.words.filter(w=>w.lessonId===l.id).length+' слов</p><button onclick="selected='+l.id+';showLesson()">Открыть</button></div>').join("")+'<div class="card"><h3>Добавить урок</h3><form onsubmit="addLesson(event)"><label>Название урока</label><input name="title" required placeholder="Например, My family"><label>Дата (необязательно)</label><input name="date" type="date"><button class="primary">Добавить урок</button></form></div>'}else if(tab==="dictionary"){v.innerHTML='<h2>Словарь A–Z</h2><input placeholder="Поиск по английскому или русскому..." oninput="dictionary(this.value)" id="search"><div id="words"></div>';dictionary("")}else if(tab==="grammar"){v.innerHTML='<h2>Грамматика</h2>'+state.grammar.map(theoryCard).join("")+'<div class="card"><h3>Добавить правило</h3><form onsubmit="addGrammar(event)"><input name="title" placeholder="Название" required><textarea name="rule" placeholder="Правило и формула" required></textarea><textarea name="example" placeholder="Пример, произношение и перевод"></textarea><button class="primary">Сохранить</button></form></div>'}else if(tab==="practice"){let w=state.words[Math.floor(Math.random()*state.words.length)];v.innerHTML='<h2>Карточки</h2>'+(w?'<div class="card" style="text-align:center"><p class="muted">Переведи слово</p><div class="word">'+esc(w.en)+'</div><p>'+esc(w.ipa)+'</p><div id="answer" class="hidden"><p>'+esc(w.ru)+'</p><p>'+esc(w.ruPron)+'</p></div><button onclick="document.getElementById(\'answer\').classList.toggle(\'hidden\')">Показать / скрыть ответ</button> <button onclick="render()">Следующее слово</button></div>':'<p>Добавь слова, чтобы начать тренировку.</p>')}else{v.innerHTML='<h2>Мои данные</h2><p>Данные сейчас сохраняются только в браузере этого устройства. Для переноса на другое устройство используй резервную копию.</p><div class="card"><button onclick="exportData()">Скачать резервную копию JSON</button><p><label>Восстановить из JSON</label><input type="file" accept=".json,application/json" onchange="importData(event)"></p></div><p class="muted">Синхронизация и распознавание скриншотов будут добавлены позже.</p>'}}function theoryExample(en,pron,ru){return '<div class="theory-ex"><div class="en">'+esc(en)+'</div><div class="pron">🔊 '+esc(pron)+'</div><div class="ru">'+esc(ru)+'</div></div>'}function theoryCard(g,i){const be=/^To be:/i.test(g.title),sp=/^Special questions:/i.test(g.title);let body='';if(be){body='<div class="theory-block"><h4>01 · Выбираем форму глагола</h4><table class="theory-table"><tr><td>I — я</td><td>am</td></tr><tr><td>He / She / It — он / она / оно</td><td>is</td></tr><tr><td>You / We / They — ты / вы / мы / они</td><td>are</td></tr></table></div><div class="theory-block"><h4>02 · Три типа предложений</h4><div class="theory-note">✓ Утверждение</div><div class="theory-formula">Кто + am/is/are + остальное</div>'+theoryExample("She is a doctor.","ши из э дОктэр","Она врач.")+'<div class="theory-note">✕ Отрицание</div><div class="theory-formula">Кто + am/is/are + not + остальное</div>'+theoryExample("She is not angry.","ши из нОт Энгри","Она не сердится.")+'<div class="theory-note">? Вопрос</div><div class="theory-formula">Am/Is/Are + кто + остальное?</div>'+theoryExample("Is she a doctor?","из ши э дОктэр","Она врач?")+'</div><div class="theory-block"><h4>03 · Сокращения</h4><span class="theory-chip">I am → I’m</span><span class="theory-chip">He is → He’s</span><span class="theory-chip">She is → She’s</span><span class="theory-chip">is not → isn’t</span><span class="theory-chip">are not → aren’t</span></div><div class="theory-block"><h4>💡 Запомни</h4><p class="theory-note">С профессиями в единственном числе обычно используем a / an: <b>a doctor</b>, <b>an office worker</b>.</p></div>'}else if(sp){body='<div class="theory-block"><h4>01 · Формула вопроса</h4><div class="theory-formula">Вопросительное слово + am/is/are + кто + остальное?</div>'+theoryExample("Where are you from?","уЭР а ю фром","Откуда ты?")+'</div><div class="theory-block"><h4>02 · Вопросительные слова</h4>'+[["What","что / какой"],["When","когда"],["Where","где / куда"],["Why","почему"],["Who","кто"],["Whose","чей"],["How","как"],["How old","сколько лет"],["How many","сколько (исчисляемых)"],["How much","сколько / цена"]].map(x=>'<span class="theory-chip">'+esc(x[0])+' · '+esc(x[1])+'</span>').join("")+'</div><div class="theory-block"><h4>03 · Примеры</h4>'+theoryExample("What is your job?","уОт из йор джОб","Кем ты работаешь?")+theoryExample("Why are you late?","уАЙ а ю лЭЙТ","Почему ты опоздал?")+theoryExample("How old is she?","хАУ ОУЛД из ши","Сколько ей лет?")+'</div><div class="theory-block"><h4>💡 Запомни</h4><p class="theory-note">На специальный вопрос отвечаем информацией, а не просто Yes или No.</p></div>'}else{body='<div class="theory-block"><h4>📌 Правило</h4><p class="theory-note">'+esc(g.rule)+'</p></div>'+(g.example?'<div class="theory-block"><h4>✏️ Примеры</h4><p class="theory-note">'+esc(g.example)+'</p></div>':'')}return '<article class="card theory-card"><div class="theory-head"><span class="theory-icon">'+(be?'🔤':sp?'❔':'📖')+'</span><div><div class="theory-kicker">Грамматика · A1</div><h3>'+esc(g.title)+'</h3></div></div><div class="theory-sub">Пошаговая шпаргалка с примерами</div>'+body+'</article>'}function showLesson(){let l=state.lessons.find(x=>x.id===selected);tab="lessons";nav();v.innerHTML='<button onclick="render()">← Все уроки</button><h2>Урок '+l.id+': '+esc(l.title)+'</h2>'+state.words.filter(w=>w.lessonId===selected).sort((a,b)=>a.en.localeCompare(b.en,'en',{sensitivity:'base'})).map(wordCard).join("")+'<div class="card"><h3>Добавить слово или фразу</h3><form onsubmit="addWord(event)">'+[['en','Английское слово / фраза'],['ipa','IPA'],['ruPron','Русская транскрипция с ударением'],['ru','Перевод'],['example','Пример на английском'],['examplePron','Произношение примера'],['exampleRu','Перевод примера']].map(([n,p])=>'<label>'+p+'</label><input name="'+n+'" '+(n==="en"||n==="ru"?"required":"")+' placeholder="'+p+'">').join("")+'<button class="primary">Добавить слово</button></form></div>'}function wordCard(w){return '<div class="card"><div class="row"><span class="word">'+esc(w.en)+'</span><button onclick="toggleFav('+w.id+')">'+(state.favorites.includes(w.id)?"★":"☆")+'</button><button onclick="toggleLearn('+w.id+')">'+(state.learned.includes(w.id)?"✓ Выучено":"Отметить")+'</button></div><p>'+esc(w.ipa)+' · '+esc(w.ruPron)+'</p><b>'+esc(w.ru)+'</b><details><summary>Пример</summary><p>'+esc(w.example)+'</p><p>'+esc(w.examplePron)+'</p><p class="muted">'+esc(w.exampleRu)+'</p></details></div>'}function dictionary(q){let ws=state.words.filter(w=>(w.en+" "+w.ru).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.en.localeCompare(b.en));document.getElementById("words").innerHTML=ws.map(wordCard).join("")||'<div class="empty">Пока ничего не найдено</div>'}function addLesson(e){e.preventDefault();let f=new FormData(e.target),id=Math.max(0,...state.lessons.map(x=>x.id))+1;state.lessons.push({id,title:f.get("title"),date:f.get("date")});save();render()}function addWord(e){e.preventDefault();let f=new FormData(e.target),w={id:Date.now(),lessonId:selected};for(let k of ["en","ipa","ruPron","ru","example","examplePron","exampleRu"])w[k]=f.get(k);state.words.push(w);save();showLesson()}function addGrammar(e){e.preventDefault();let f=new FormData(e.target);state.grammar.push({title:f.get("title"),rule:f.get("rule"),example:f.get("example")});save();render()}function toggleFav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()}function toggleLearn(id){state.learned=state.learned.includes(id)?state.learned.filter(x=>x!==id):[...state.learned,id];save();render()}function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="my-english-notebook.json";a.click();URL.revokeObjectURL(a.href)}async function importData(e){try{let s=JSON.parse(await e.target.files[0].text());if(!Array.isArray(s.words)||!Array.isArray(s.lessons))throw Error("Неверный формат");state=s;save();render();alert("Данные восстановлены")}catch{alert("Не удалось прочитать резервную копию")}}
